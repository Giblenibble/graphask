[project]
name = "graphask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Giblenibble", email = "jatinksuggula@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.151.0",
    "httpx>=0.28.1",
    "httpx2>=2.15.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
graphask = "graphask:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
